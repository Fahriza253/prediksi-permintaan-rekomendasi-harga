[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-prediction-system"
version = "0.1.0"
description = "UTS AI & ML — prediksi permintaan dan rekomendasi harga"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
py-prediction-pipeline = "py_prediction_system.run_pipeline:main"
py-prediction-report = "py_prediction_system.reporting.export_docx:main"